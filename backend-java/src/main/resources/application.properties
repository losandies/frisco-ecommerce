spring.application.name=backend-java


spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/frisco_dev}
spring.datasource.username=${DB_USERNAME:losandies}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Reject fractional JSON values for integer fields instead of silently truncating them.
spring.jackson.deserialization.accept-float-as-int=false
