# Activated only on EC2; local development retains application.properties defaults.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Existing deployments must have their schema provisioned before startup.
# Versioned database migrations are a documented follow-up.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# Nginx provides the public HTTPS endpoint; cookies are explicitly secure above.
# Do not trust arbitrary forwarded headers from the viewer.
server.forward-headers-strategy=none
