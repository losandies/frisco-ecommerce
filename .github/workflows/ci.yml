name: Verify application

on:
    pull_request:
    push:
        branches:
            - master
    workflow_dispatch:
permissions:
    contents: read

jobs:
    backend:
        name: Backend tests
        runs-on: ubuntu-latest
        timeout-minutes: 15

        defaults:
            run:
                working-directory: backend-java

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Java
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: '21'
                  cache: maven
                  cache-dependency-path: backend-java/pom.xml

            - name: Build and test
              run: bash ./mvnw -B verify

    frontend:
        name: Frontend checks
        runs-on: ubuntu-latest
        timeout-minutes: 15

        defaults:
            run:
                working-directory: client
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: npm
                  cache-dependency-path: client/package-lock.json
            - name: Install dependencies
              run: npm ci

            - name: Check TypeScript
              run: npm run typecheck

            - name: Build frontend
              run: npm run build
