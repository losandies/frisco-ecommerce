name: Deploy backend

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing immutable ECR tag (for example sha-<commit SHA> or v1)"
        required: true
        type: string

permissions:
  contents: read

# Do not cancel a deployment while the EC2 script might be rolling back.
concurrency:
  group: frisco-production-backend
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      IMAGE_TAG: ${{ inputs.image_tag }}
      DEPLOY_ROLE: ${{ vars.FRISCO_DEPLOY_ROLE_ARN }}
      INSTANCE_ID: ${{ vars.FRISCO_INSTANCE_ID }}
      SSM_DOCUMENT: ${{ vars.FRISCO_DEPLOY_DOCUMENT }}
    steps:
      - name: Verify deployment configuration and version
        shell: bash
        run: |
          test -n "$DEPLOY_ROLE"
          test -n "$INSTANCE_ID"
          test -n "$SSM_DOCUMENT"
          [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]
      - name: Obtain temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: frisco-deploy-${{ github.run_id }}
      - name: Verify image exists
        run: aws ecr describe-images --repository-name frisco-backend --image-ids "imageTag=$IMAGE_TAG" --region "$AWS_REGION" --query 'imageDetails[0].imageDigest' --output text
      - name: Deploy through Systems Manager and wait for result
        shell: bash
        run: |
          parameters="$(jq -cn --arg tag "$IMAGE_TAG" '{ImageTag: [$tag]}')"
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "$SSM_DOCUMENT" \
            --parameters "$parameters" \
            --timeout-seconds 600 \
            --region "$AWS_REGION" \
            --query Command.CommandId --output text)"
          echo "SSM command: $command_id"

          for attempt in {1..90}; do
            if aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" > invocation.json 2> invocation-error.txt; then
              status="$(jq -r '.Status' invocation.json)"
              case "$status" in
                Success)
                  jq -r '.StandardOutputContent' invocation.json
                  printf 'Deployed backend tag: `%s`\n' "$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                  ;;
                Pending|InProgress|Delayed) ;;
                *)
                  jq -r '.Status, .StandardOutputContent, .StandardErrorContent' invocation.json
                  exit 1
                  ;;
              esac
            elif ! grep -q 'InvocationDoesNotExist' invocation-error.txt; then
              cat invocation-error.txt >&2
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for SSM. Check command $command_id before retrying; it may still be running." >&2
          exit 1
