name: Publish backend image

on:
  push:
    branches: [master]
    paths:
      - "backend-java/**"
      - ".github/workflows/publish-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-backend-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      ECR_REGISTRY: 775893835482.dkr.ecr.us-east-1.amazonaws.com
      IMAGE_TAG: sha-${{ github.sha }}
      PUBLISH_ROLE: ${{ vars.FRISCO_PUBLISH_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify publishing configuration
        run: test -n "$PUBLISH_ROLE"
      - name: Obtain temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.PUBLISH_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: frisco-publish-${{ github.run_id }}
      - name: Authenticate Docker to ECR
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Build, test, and publish Arm64 image
        uses: docker/build-push-action@v7
        with:
          context: ./backend-java
          platforms: linux/arm64
          push: true
          tags: ${{ env.ECR_REGISTRY }}/frisco-backend:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=frisco-arm64
          cache-to: type=gha,mode=max,scope=frisco-arm64
      - name: Record deployment version
        run: |
          printf 'Published backend tag: `%s`\n\nDeployment remains a separate manual action.\n' "$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
